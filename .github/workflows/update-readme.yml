name: Update current-project section

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours — adjust as you like
  workflow_dispatch:         # adds a manual "Run workflow" button

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Detect current project and update README
        env:
          GH_USERNAME: uplsiddharth-byte
          GH_TOKEN: ${{ secrets.PROFILE_PAT }}
          LOOKBACK_DAYS: '10'
          # EXTRA_EXCLUDE_REPOS: 'uplsiddharth-byte/some-coursework-repo'
        run: python scripts/update_readme.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No README changes to commit."
            exit 0
          fi
          git commit -m "chore: auto-update current project"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}, retrying..."
            sleep 2
          done
          echo "Failed to push after retries."
          exit 1
